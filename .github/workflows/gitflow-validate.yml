# .github/workflows/gitflow-validate.yml
name: GitFlow Validate

on:
  pull_request:
    branches:
      - develop
      - main
      - "release/**"

permissions:
  contents: write
  pull-requests: write

jobs:
  validate:
    uses: renatofreitasRR/git-flow-module/.github/workflows/gitflow-validate.yml@v1.0.2