# .github/workflows/gitflow-auto-pr.yml
name: GitFlow Auto PR

on:
  push:
    branches:
      - "feature/**"
      - develop
      - "release/**"
      - "hotfix/**"

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-pr:
    uses: renatofreitasRR/git-flow-module/.github/workflows/auto-pr-gitflow.yml@v1.0.1